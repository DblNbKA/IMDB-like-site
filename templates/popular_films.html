{% extends "templates/shablon.html" %}

{% block content %}
<img class="logo"src="{{url_for('static', filename='img/popcorn.png')}}" alt="logo", width="90px" height="90px">
    
<a href="/">
    <h1 class="title">PopCornFilms</h1>
</a>
    
    <div class="menu">
        <hr>
        <h1>Popular Now</h1>
        
            <a href="/popular/next/{{response_popular['page']}}" class="more">
                <button type="button" class="more">Next</button>
            </a>
            {% if page_num >=2 %}
                <a href="/popular/back/{{response_popular['page']}}">
                    <button type="button">Back</button>
                </a>
            {% endif %}
        
        <div class="row2">
            {%for item in response_popular['results']%}     
            <a href='/info/movie/id={{item["id"]}}'>             
                <img class="imgfilm" src='https://image.tmdb.org/t/p/original/{{item["poster_path"]}}' height="250" width="177">       
            </a>           
            {% endfor %}     
        </div>
        <hr>
        <p class="footer"><a href="https://www.freepik.com/">Image source</a></p>
        <p class="footer"><a href="https://developer.themoviedb.org/reference/intro/getting-started">API source</a></p>
    </div>
    
{% endblock %}
