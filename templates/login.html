<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='static/rgs.css') }}">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='img/popcorn.png') }}">
</head>
<body>
    
    <img class="logo"src="{{url_for('static', filename='img/popcorn.png')}}" alt="logo", width="90px" height="90px">
    
    <a href="/">
        <h1 class="title">PopCornFilms</h1>
    </a>
    <div>
        <h2>Log In</h2>
        <form action="/login" method="post">
            <label for="email"><b>Email</b></label> <br>
            <input  type="email" placeholder="Email" name="email" id="email" required><br>
            <label for="password"><b>Password</b></label><br>
            <input  type="password" placeholder="Password" name="password" id="password"><br>
            <input type="submit" value="Submit">
        </form>
        <form action="/reg" method="post">
            <p>Don't have an account?</p>
            <input type="submit" value="registration">
        </form>
    </div>
</body>
</html>
